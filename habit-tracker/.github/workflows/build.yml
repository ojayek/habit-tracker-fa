name: Build Windows MSI

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm install -g wix-msi
      - run: wix-msi habit-tracker
      - uses: actions/upload-artifact@v4
        with:
          name: habit-tracker-msi
          path: build/